<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fasting Lane Support</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f1ea;
        --bg-alt: #ede6dc;
        --card: #ffffff;
        --text: #1b1c1a;
        --muted: #6a6760;
        --accent: #2f6b5e;
        --border: #e2d9cd;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121514;
          --bg-alt: #0b0e0e;
          --card: #1b201f;
          --text: #f2f1ed;
          --muted: #a8a39b;
          --accent: #e1b35d;
          --border: #2b3230;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, var(--bg), var(--bg-alt));
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 20px 64px;
      }
      .card {
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 18px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        color: var(--accent);
      }
      .footer {
        margin-top: 18px;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Fasting Lane Support</h1>
        <p>
          Need help, have feedback, or want to report a bug? Email us and we will
          get back to you.
        </p>
        <p>
          <strong>Email:</strong>
          <a href="mailto:dirkwybe@gmail.com">dirkwybe@gmail.com</a>
        </p>
        <p>
          Please include your device model, iOS version, and a brief description of the issue.
        </p>
        <div class="footer">
          <a href="index.html">Back to Fasting Lane</a>
        </div>
      </div>
    </div>
  </body>
</html>
